# Compose derives its project name from the directory name, which is "server" here —
# a name shared with other projects, causing them to collide on the same volume.
name: threejs-portfolio

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: threejs_user
      POSTGRES_PASSWORD: threejs_password
      POSTGRES_DB: threejs_database
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/seed/seed.sql:/docker-entrypoint-initdb.d/seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threejs_user -d threejs_database"]
      interval: 1s
      timeout: 3s
      retries: 30
volumes:
  postgres_data: